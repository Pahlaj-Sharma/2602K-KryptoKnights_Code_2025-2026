<!DOCTYPE html>
<html>
<head>
    <title>2602K Path Creator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            gap: 30px;
            background-color: #1a1a1a;
            color: #e0e0e0;
            min-width: 1000px;
            padding: 20px;
        }
        h1 {
            color: #64b5f6;
            text-align: center;
            font-weight: 300;
            letter-spacing: 2px;
        }
        canvas {
            border: 2px solid #444;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            background-color: #2c2c2c;
            border-radius: 8px;
        }
        #controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .control-button {
            background-color: #4a4a4a;
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            font-weight: 600;
        }
        .control-button:hover {
            background-color: #5a5a5a;
            transform: translateY(-2px);
        }
        #output {
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #a0a0a0;
            padding: 15px;
            border-radius: 8px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
        }
        .control-section {
            background: linear-gradient(145deg, #2c2c2c, #1f1f1f);
            color: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 250px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
        }
        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2em;
            font-weight: 600;
            color: #fff;
        }
        .control-header span {
            transform: rotate(180deg);
            transition: transform 0.3s;
        }
        .control-header.collapsed span {
            transform: rotate(0deg);
        }
        .control-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }
        .control-content.hidden {
            display: none;
        }
        .control-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .control-field label {
            font-size: 0.9em;
            color: #bbb;
        }
        .control-field input {
            background-color: #3b3b3b;
            border: 1px solid #555;
            color: #fff;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .control-field input:focus {
            outline: none;
            border-color: #64b5f6;
        }
        .action-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            gap: 10px;
        }
        .action-buttons button {
            flex-grow: 1;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.3s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        .action-buttons .update-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
        }
        .action-buttons .update-btn:hover {
            background-color: #45a049;
        }
        .action-buttons .delete-btn {
            background-color: #f44336;
            color: white;
            border: none;
        }
        .action-buttons .delete-btn:hover {
            background-color: #da190b;
        }
        .action-buttons .rotate-btn {
            background-color: #2196F3;
            color: white;
            border: none;
            flex-grow: 0;
            width: 40px;
        }
        .action-buttons .rotate-btn:hover {
            background-color: #0b7dda;
        }
        .copy-button {
            background-color: #FF5722;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            font-weight: 600;
        }
        .copy-button:hover {
            background-color: #e64a19;
            transform: translateY(-2px);
        }
        .velocity-display {
            position: absolute;
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 5px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <h1>2602K Path Creator</h1>
    <canvas id="pathCanvas"></canvas>
    <div id="controls">
        <button class="control-button" onclick="clearCanvas()">Clear Path</button>
        <button class="control-button" onclick="flipHorizontal()">Flip Horizontal</button>
        <button class="control-button" onclick="flipVertical()">Flip Vertical</button>
        <input type="file" id="fileInput" accept=".txt" style="display: none;" onchange="loadPathFile(event)">
        <button class="control-button" onclick="document.getElementById('fileInput').click()">Load Path File</button>
        <button class="control-button" onclick="startAnimation()">Simulate Path</button>
    <button class="control-button" onclick="generateData()">Generate Path Data</button>
        <button class="copy-button" onclick="copymoveTo()">Copy moveTo()</button>
        <pre id="output"></pre>
        <div id="controlPanel" class="control-section">
            <div class="control-header">
                Control <span>&#9660;</span>
            </div>
            <div class="control-content">
                <div class="control-field">
                    <label>X</label>
                    <input type="number" id="xInput" step="0.01">
                </div>
                <div class="control-field">
                    <label>Y</label>
                    <input type="number" id="yInput" step="0.01">
                </div>
                <div class="control-field">
                    <label>Heading</label>
                    <input type="number" id="headingInput" step="1">
                </div>
                <div class="control-field">
                    <label>Max Velocity</label>
                    <input type="number" id="maxVelInput" step="5" min="25" max="127" value="127">
                </div>
                <div class="action-buttons">
                    <button class="update-btn" onclick="updatePoint()">Update</button>
                    <button class="delete-btn" onclick="deletePoint()">Delete</button>
                    <button class="rotate-btn" onclick="rotateHeading(-90)">&#x21BA;</button>
                    <button class="rotate-btn" onclick="rotateHeading(90)">&#x21BB;</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('pathCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 600;
        canvas.height = 600;

        const FIELD_SIZE = 144; // inches
        const PIXEL_TO_INCH = canvas.width / FIELD_SIZE;

        const fieldImagePath = 'field.png';
        const fieldImage = new Image();
        fieldImage.src = fieldImagePath;

        fieldImage.onload = () => {
            draw();
        };

        let points = [];
        let segments = [];
        
        const pointRadius = 8;
        let isDragging = false;
        let selectedPoint = null;
        
        let animationProgress = 0;
        let pathPointsData = [];
        let isAnimating = false;

        const controlPanel = document.getElementById('controlPanel');
        const xInput = document.getElementById('xInput');
        const yInput = document.getElementById('yInput');
        const headingInput = document.getElementById('headingInput');
        const maxVelInput = document.getElementById('maxVelInput');

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (fieldImage.complete) {
                ctx.drawImage(fieldImage, 0, 0, canvas.width, canvas.height);
            }

            if (points.length >= 2) {
                const generatedPoints = generatePathPoints(points, 50); 
                
                for (let i = 0; i < generatedPoints.length - 1; i++) {
                    const velocity = Math.abs(generatedPoints[i].velocity || 0);
                    const normalizedVel = Math.min(1, velocity / 127);
                    
                    const red = Math.floor(255 * (1 - normalizedVel));
                    const green = Math.floor(255 * normalizedVel);
                    
                    const segmentIndex = Math.floor(i / 50);
                    if (segments[segmentIndex] && segments[segmentIndex].reverse) {
                        ctx.strokeStyle = '#9e42f5'; 
                    } else {
                        ctx.strokeStyle = `rgb(${red}, ${green}, 0)`;
                    }

                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(generatedPoints[i].x, generatedPoints[i].y);
                    ctx.lineTo(generatedPoints[i + 1].x, generatedPoints[i + 1].y);
                    ctx.stroke();
                }
            }

            for (let i = 0; i < points.length; i++) {
                const point = points[i];
                ctx.beginPath();
                ctx.arc(point.x, point.y, point === selectedPoint ? pointRadius + 3 : pointRadius, 0, 2 * Math.PI);
                
                if (i === 0 && points.length > 1) {
                    ctx.fillStyle = '#4CAF50'; 
                } else if (i === points.length - 1 && points.length > 1) {
                    ctx.fillStyle = '#f44336';
                } else {
                    ctx.fillStyle = '#2196F3';
                }
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();

                let theta = point.heading;
                if (theta === undefined || theta === null) {
                    if (i < points.length - 1) {
                        theta = getThetaFromPoints(points[i], points[i+1]);
                    } else if (i > 0) {
                        theta = getThetaFromPoints(points[i-1], points[i]);
                    } else {
                        theta = 0;
                    }
                    point.heading = theta;
                }
                drawHeadingArrow(point.x, point.y, theta);
            }
            
            if (isAnimating && pathPointsData.length > 0) {
                const robotPoint = pathPointsData[Math.floor(animationProgress)];
                if (robotPoint) {
                    drawRobot(robotPoint.canvasX, robotPoint.canvasY, robotPoint.theta);
                }
            }
        }
        
        function drawRobot(x, y, heading) {
            const robotWidth = 15; 
            const robotLength = 18;
            
            const robotWidthPixels = robotWidth * PIXEL_TO_INCH;
            const robotLengthPixels = robotLength * PIXEL_TO_INCH;
            
            ctx.save();
            ctx.translate(x, y);
            
            // Correct the rotation so the longer side is the length
            ctx.rotate((heading) * Math.PI / 180); 
            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.fillRect(-robotWidthPixels / 2, -robotLengthPixels / 2, robotWidthPixels, robotLengthPixels);
            
            // Draw the robot's heading arrow
            const arrowLength = robotLengthPixels / 2;
            ctx.beginPath();
            ctx.moveTo(0, 0); 
            ctx.lineTo(0, -arrowLength); 
            ctx.strokeStyle = '#FFFF00'; 
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.restore();
        }
        
        function getThetaFromPoints(p1, p2) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            let theta = Math.atan2(dx, -dy);
            return (theta * 180 / Math.PI + 360) % 360;
        }
        
        function lerpAngle(a, b, t) {
            let diff = b - a;
            if (diff > 180) diff -= 360;
            if (diff < -180) diff += 360;
            return (a + diff * t + 360) % 360;
        }

        function drawHeadingArrow(x, y, heading) {
            const arrowLength = 15;
            const angleRad = (heading) * Math.PI / 180;
            
            const dx = Math.sin(angleRad) * arrowLength;
            const dy = -Math.cos(angleRad) * arrowLength;

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + dx, y + dy);
            ctx.strokeStyle = 'cyan';
            ctx.lineWidth = 2;
            ctx.stroke();

            const arrowHeadAngle = Math.PI / 6;
            ctx.beginPath();
            ctx.moveTo(x + dx, y + dy);
            ctx.lineTo(x + dx - arrowLength * 0.3 * Math.sin(angleRad - arrowHeadAngle), y + dy + arrowLength * 0.3 * Math.cos(angleRad - arrowHeadAngle));
            ctx.moveTo(x + dx, y + dy);
            ctx.lineTo(x + dx - arrowLength * 0.3 * Math.sin(angleRad + arrowHeadAngle), y + dy + arrowLength * 0.3 * Math.cos(angleRad + arrowHeadAngle));
            ctx.strokeStyle = 'cyan';
            ctx.stroke();
        }

        function isNearPoint(x, y) {
            for (const point of points) {
                const dx = x - point.x;
                const dy = y - point.y;
                if (Math.hypot(dx, dy) < 15) {
                    return point;
                }
            }
            return null;
        }

        function isNearPath(x, y) {
            if (points.length < 2) return null;
            const pathSpline = generatePathPoints(points, 20);
            for (let i = 0; i < pathSpline.length - 1; i++) {
                const p1 = pathSpline[i];
                const p2 = pathSpline[i+1];
                const dist = pointToLineSegmentDistance(x, y, p1.x, p1.y, p2.x, p2.y);
                if (dist < 10) {
                    const segmentIndex = Math.floor(i / 20);
                    return segmentIndex;
                }
            }
            return null;
        }

        function pointToLineSegmentDistance(px, py, x1, y1, x2, y2) {
            const l2 = Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2);
            if (l2 === 0) return Math.hypot(px - x1, py - y1);
            let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
            t = Math.max(0, Math.min(1, t));
            const projectionX = x1 + t * (x2 - x1);
            const projectionY = y1 + t * (y2 - y1);
            return Math.hypot(px - projectionX, py - projectionY);
        }

        canvas.addEventListener('mousedown', (event) => {
            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            const clickedPoint = isNearPoint(x, y);
            
            if (clickedPoint) {
                selectedPoint = clickedPoint;
                isDragging = true;
                updateControlPanel();
            } else {
                const clickedSegment = isNearPath(x, y);
                if (clickedSegment !== null && segments[clickedSegment]) {
                    segments[clickedSegment].reverse = !segments[clickedSegment].reverse;
                    draw();
                } else {
                    let defaultHeading = 0;
                    if (points.length > 0) {
                        defaultHeading = getThetaFromPoints(points[points.length - 1], {x, y});
                    }
                    
                    const newPoint = { 
                        x, 
                        y, 
                        heading: defaultHeading,
                        maxVelocity: 127
                    };
                    points.push(newPoint);
                    
                    if (points.length > 1) {
                        const prevPoint = points[points.length - 2];
                        if (prevPoint.heading === undefined || prevPoint.heading === null || !prevPoint.manuallySet) {
                            prevPoint.heading = getThetaFromPoints(prevPoint, newPoint);
                            prevPoint.manuallySet = false;
                        }
                        segments.push({ reverse: false });
                    }
                    
                    selectedPoint = newPoint;
                    updateControlPanel();
                    draw();
                }
            }
        });

        canvas.addEventListener('mousemove', (event) => {
            if (!isDragging || !selectedPoint) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            selectedPoint.x = x;
            selectedPoint.y = y;

            const currentIndex = points.indexOf(selectedPoint);
            if (currentIndex > 0) {
                const prevPoint = points[currentIndex - 1];
                if (!prevPoint.manuallySet) {
                    prevPoint.heading = getThetaFromPoints(prevPoint, selectedPoint);
                }
            }

            draw();
            updateControlPanel();
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        function updateControlPanel() {
            if (selectedPoint) {
                const vexX = (selectedPoint.x - canvas.width / 2) / PIXEL_TO_INCH;
                const vexY = (canvas.height / 2 - selectedPoint.y) / PIXEL_TO_INCH;
                
                xInput.value = vexX.toFixed(2);
                yInput.value = vexY.toFixed(2);
                headingInput.value = selectedPoint.heading.toFixed(2);
                maxVelInput.value = selectedPoint.maxVelocity || 127;
                controlPanel.style.display = 'block';
            } else {
                controlPanel.style.display = 'none';
            }
        }

        function updatePoint() {
            if (!selectedPoint) return;
            
            const newVexX = parseFloat(xInput.value);
            const newVexY = parseFloat(yInput.value);
            
            selectedPoint.x = newVexX * PIXEL_TO_INCH + canvas.width / 2;
            selectedPoint.y = canvas.height / 2 - newVexY * PIXEL_TO_INCH;
            selectedPoint.heading = parseFloat(headingInput.value);
            selectedPoint.maxVelocity = parseFloat(maxVelInput.value);
            selectedPoint.manuallySet = true;
            
            draw();
        }

        function rotateHeading(angle) {
            if (!selectedPoint) return;
            
            let currentHeading = parseFloat(headingInput.value);
            currentHeading += angle;
            currentHeading = (currentHeading % 360 + 360) % 360;
            
            headingInput.value = currentHeading.toFixed(2);
            updatePoint();
        }

        function deletePoint() {
            if (!selectedPoint) return;
            
            const index = points.indexOf(selectedPoint);
            if (index > -1) {
                points.splice(index, 1);
                if (segments.length > index) {
                    segments.splice(index, 1);
                } else if (segments.length > 0) {
                    segments.pop();
                }
            }
            selectedPoint = null;
            draw();
            updateControlPanel();
        }
        
        function getCatmullRomPoint(p0, p1, p2, p3, t) {
            const t2 = t * t;
            const t3 = t2 * t;
            
            const q1 = -t3 + 2.0 * t2 - t;
            const q2 = 3.0 * t3 - 5.0 * t2 + 2.0;
            const q3 = -3.0 * t3 + 4.0 * t2 + t;
            const q4 = t3 - t2;

            const x = 0.5 * (p0.x * q1 + p1.x * q2 + p2.x * q3 + p3.x * q4);
            const y = 0.5 * (p0.y * q1 + p1.y * q2 + p2.y * q3 + p3.y * q4);
            
            return { x, y };
        }

        function getCatmullRomDerivative(p0, p1, p2, p3, t) {
            const t2 = t * t;
            
            const dq1 = -3.0 * t2 + 4.0 * t - 1.0;
            const dq2 = 9.0 * t2 - 10.0 * t;
            const dq3 = -9.0 * t2 + 8.0 * t + 1.0;
            const dq4 = 3.0 * t2 - 2.0 * t;

            const dx = 0.5 * (p0.x * dq1 + p1.x * dq2 + p2.x * dq3 + p3.x * dq4);
            const dy = 0.5 * (p0.y * dq1 + p1.y * dq2 + p2.y * dq3 + p3.y * dq4);

            return { dx, dy };
        }

        function generatePathPoints(controlPoints, numSteps) {
            if (controlPoints.length < 2) return [];

            const pathPoints = [];
            let tempPoints = [];

            const startDx = Math.sin(controlPoints[0].heading * Math.PI / 180) * 12;
            const startDy = -Math.cos(controlPoints[0].heading * Math.PI / 180) * 12;
            const startVirtual = { 
                x: controlPoints[0].x - startDx,
                y: controlPoints[0].y - startDy, 
                heading: controlPoints[0].heading,
                maxVelocity: controlPoints[0].maxVelocity || 127
            };
            
            const lastPoint = controlPoints[controlPoints.length - 1];
            const endDx = Math.sin(lastPoint.heading * Math.PI / 180) * 12;
            const endDy = -Math.cos(lastPoint.heading * Math.PI / 180) * 12;
            const endVirtual = { 
                x: lastPoint.x + endDx, 
                y: lastPoint.y + endDy, 
                heading: lastPoint.heading,
                maxVelocity: lastPoint.maxVelocity || 127
            };

            tempPoints = [startVirtual, ...controlPoints, endVirtual];

            for (let i = 0; i < tempPoints.length - 3; i++) {
                const p0 = tempPoints[i];
                const p1 = tempPoints[i + 1];
                const p2 = tempPoints[i + 2];
                const p3 = tempPoints[i + 3];

                for (let j = 0; j < numSteps; j++) {
                    const t = j / numSteps;
                    const point = getCatmullRomPoint(p0, p1, p2, p3, t);
                    
                    const derivative = getCatmullRomDerivative(p0, p1, p2, p3, t);
                    const speed = Math.hypot(derivative.dx, derivative.dy);
                    
                    let curvature = 0;
                    if (speed > 0.001) {
                        const dt = 0.01;
                        const t1 = Math.max(0, t - dt);
                        const t2 = Math.min(1, t + dt);
                        const d1 = getCatmullRomDerivative(p0, p1, p2, p3, t1);
                        const d2 = getCatmullRomDerivative(p0, p1, p2, p3, t2);
                        const ddx = (d2.dx - d1.dx) / (2 * dt);
                        const ddy = (d2.dy - d1.dy) / (2 * dt);
                        curvature = Math.abs(derivative.dx * ddy - derivative.dy * ddx) / Math.pow(speed, 3);
                    }
                    
                    const segmentMaxVel = p1.maxVelocity || 127;
                    const nextSegmentMaxVel = p2.maxVelocity || 127;
                    const maxVelAtPoint = segmentMaxVel * (1 - t) + nextSegmentMaxVel * t;
                    
                    const curvatureVelLimit = Math.min(127, 127 / (1 + curvature * 40)); 
                    const velocity = Math.min(maxVelAtPoint, curvatureVelLimit);
                    
                    point.velocity = velocity;
                    pathPoints.push(point);
                }
            }
            
            const finalPoint = tempPoints[tempPoints.length - 2];
            finalPoint.velocity = finalPoint.maxVelocity || 25;
            pathPoints.push(finalPoint);
            
            return pathPoints;
        }

        // NEW: Function to generate and save path data, also used for simulation
        function generateData() {
            const outputDiv = document.getElementById('output');
            
            if (points.length < 2) {
                outputDiv.textContent = "Please create a path with at least 2 points.";
                return;
            }

            const pathData = [];
            const numSteps = 75; 
            const accelDistance = 8; // Adjusted for faster ramp-up
            const minVelocity = 25;

            const generatedPoints = generatePathPoints(points, numSteps);

            let currentDistance = 0;
            let totalPathLength = 0;
            
            for (let i = 1; i < generatedPoints.length; i++) {
                const p1 = generatedPoints[i - 1];
                const p2 = generatedPoints[i];
                totalPathLength += Math.hypot(p2.x - p1.x, p2.y - p1.y) / PIXEL_TO_INCH;
            }
            
            const convertedPoints = generatedPoints.map(p => ({
                x: (p.x - canvas.width / 2) / PIXEL_TO_INCH,
                y: (canvas.height / 2 - p.y) / PIXEL_TO_INCH,
                velocity: p.velocity || 127
            }));

            for (let i = 0; i < convertedPoints.length; i++) {
                const currentPoint = convertedPoints[i];
                let prevPoint = i > 0 ? convertedPoints[i-1] : currentPoint;
                
                const segmentLength = Math.hypot(currentPoint.x - prevPoint.x, currentPoint.y - prevPoint.y);
                currentDistance += segmentLength;
                
                let theta = 0;
                let waypointIndex = Math.floor(i / numSteps);
                let t = (i % numSteps) / numSteps;
                
                if (waypointIndex < points.length - 1) {
                    const currentControlPoint = points[waypointIndex];
                    const nextControlPoint = points[waypointIndex + 1];
                    theta = lerpAngle(currentControlPoint.heading, nextControlPoint.heading, t);
                } else {
                    theta = points[points.length-1].heading || 0;
                }
                
                let velocity = currentPoint.velocity;
                
                const accelFactor = Math.min(1, currentDistance / accelDistance);
                const decelFactor = Math.min(1, (totalPathLength - currentDistance) / accelDistance);
                const speedProfile = Math.min(accelFactor, decelFactor);
                
                velocity = Math.max(minVelocity, velocity * speedProfile);
                
                const segmentIndex = Math.min(waypointIndex, segments.length - 1);
                if (segmentIndex >= 0 && segments[segmentIndex] && segments[segmentIndex].reverse) {
                    theta = (theta + 180) % 360;
                    velocity = -Math.abs(velocity);
                } else {
                    velocity = Math.abs(velocity);
                }
                
                if (Math.abs(velocity) < minVelocity) {
                    velocity = velocity < 0 ? -minVelocity : minVelocity;
                }
                
                pathData.push({ 
                    x: currentPoint.x, 
                    y: currentPoint.y, 
                    theta: theta,
                    velocity: velocity,
                    canvasX: currentPoint.x * PIXEL_TO_INCH + canvas.width / 2,
                    canvasY: canvas.height / 2 - currentPoint.y * PIXEL_TO_INCH
                });
            }

            pathPointsData = pathData;

            let outputString = `//  Path Data for Ramsete Controller\n`;
            outputString += `// Generated with ${pathData.length} points\n`;
            outputString += `// Total path length: ${totalPathLength.toFixed(2)} inches\n\n`;
            outputString += `double followPath[][] = {{\n`;
            
            pathData.forEach((point, index) => {
                const comma = index < pathData.length - 1 ? "}, {" : "}}";
                outputString += `    ${point.x.toFixed(3)}, ${point.y.toFixed(3)}, ${point.theta.toFixed(2)}, ${point.velocity.toFixed(2)}${comma}\n`;
            });
            outputString += `};\n`;

            const blob = new Blob([outputString], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = '_path.txt';
            
            document.body.appendChild(link);
            link.click();
            
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            outputDiv.textContent = `Generated path with ${pathData.length} points.\nFile '_path.txt' downloaded.\nPath length: ${totalPathLength.toFixed(2)} inches`;
        }
        
        // NEW: Function to generate data for simulation only
        function generateDataForSimulation() {
            const outputDiv = document.getElementById('output');
            
            if (points.length < 2) {
                outputDiv.textContent = "Please create a path with at least 2 points.";
                return;
            }

            const pathData = [];
            const numSteps = 75; 
            const accelDistance = 12; // Adjusted for faster ramp-up
            const minVelocity = 25;

            const generatedPoints = generatePathPoints(points, numSteps);

            let currentDistance = 0;
            let totalPathLength = 0;
            
            for (let i = 1; i < generatedPoints.length; i++) {
                const p1 = generatedPoints[i - 1];
                const p2 = generatedPoints[i];
                totalPathLength += Math.hypot(p2.x - p1.x, p2.y - p1.y) / PIXEL_TO_INCH;
            }
            
            const convertedPoints = generatedPoints.map(p => ({
                x: (p.x - canvas.width / 2) / PIXEL_TO_INCH,
                y: (canvas.height / 2 - p.y) / PIXEL_TO_INCH,
                velocity: p.velocity || 127
            }));

            for (let i = 0; i < convertedPoints.length; i++) {
                const currentPoint = convertedPoints[i];
                let prevPoint = i > 0 ? convertedPoints[i-1] : currentPoint;
                
                const segmentLength = Math.hypot(currentPoint.x - prevPoint.x, currentPoint.y - prevPoint.y);
                currentDistance += segmentLength;
                
                let theta = 0;
                let waypointIndex = Math.floor(i / numSteps);
                let t = (i % numSteps) / numSteps;
                
                if (waypointIndex < points.length - 1) {
                    const currentControlPoint = points[waypointIndex];
                    const nextControlPoint = points[waypointIndex + 1];
                    theta = lerpAngle(currentControlPoint.heading, nextControlPoint.heading, t);
                } else {
                    theta = points[points.length-1].heading || 0;
                }
                
                let velocity = currentPoint.velocity;
                
                const accelFactor = Math.min(1, currentDistance / accelDistance);
                const decelFactor = Math.min(1, (totalPathLength - currentDistance) / accelDistance);
                const speedProfile = Math.min(accelFactor, decelFactor);
                
                velocity = Math.max(minVelocity, velocity * speedProfile);
                
                const segmentIndex = Math.min(waypointIndex, segments.length - 1);
                if (segmentIndex >= 0 && segments[segmentIndex] && segments[segmentIndex].reverse) {
                    theta = (theta + 180) % 360;
                    velocity = -Math.abs(velocity);
                } else {
                    velocity = Math.abs(velocity);
                }
                
                if (Math.abs(velocity) < minVelocity) {
                    velocity = velocity < 0 ? -minVelocity : minVelocity;
                }
                
                pathData.push({ 
                    x: currentPoint.x, 
                    y: currentPoint.y, 
                    theta: theta,
                    velocity: velocity,
                    canvasX: currentPoint.x * PIXEL_TO_INCH + canvas.width / 2,
                    canvasY: canvas.height / 2 - currentPoint.y * PIXEL_TO_INCH
                });
            }

            pathPointsData = pathData;
        }

        function getmoveToCode() {
            if (points.length < 2) {
                return "// Please create a path with at least 2 points.";
            }

            let codeString = `//  moveTo() waypoints\n`;
            codeString += `// Automatically optimized speeds and timeouts\n\n`;
            
            for (let i = 0; i < points.length; i++) {
                const p = points[i];
                const x = (p.x - canvas.width / 2) / PIXEL_TO_INCH;
                const y = (canvas.height / 2 - p.y) / PIXEL_TO_INCH;
                const heading = p.heading;
                
                let maxSpeed = p.maxVelocity || 127;
                let timeout = 4000;
                let forwards = true;
                
                if (i < points.length - 1) {
                    const nextP = points[i + 1];
                    const nextX = (nextP.x - canvas.width / 2) / PIXEL_TO_INCH;
                    const nextY = (canvas.height / 2 - nextP.y) / PIXEL_TO_INCH;
                    const distance = Math.hypot(nextX - x, nextY - y);
                    const estimatedTime = (distance / (maxSpeed * 0.01)) * 1000;
                    timeout = Math.max(2000, Math.round(estimatedTime * 1.5));
                    forwards = !(segments[i] && segments[i].reverse);
                }

                codeString += `    chassis.moveTo(${x.toFixed(3)}, ${y.toFixed(3)}, ${heading.toFixed(2)}, ${timeout}, {${forwards}, 0, 0.6, ${Math.round(maxSpeed)}, 0, 0});\n`;
                if (i < points.length - 1) {
                    codeString += `    pros::delay(50); // Small delay between moves\n`;
                }
                codeString += `\n`;
            }
            
            return codeString;
        }

        function copymoveTo() {
            const code = getmoveToCode();
            navigator.clipboard.writeText(code).then(() => {
                const outputDiv = document.getElementById('output');
                outputDiv.textContent = " moveTo() code copied to clipboard!";
            }, (err) => {
                console.error('Could not copy text: ', err);
                const outputDiv = document.getElementById('output');
                outputDiv.textContent = "Failed to copy code. See console for details.";
            });
        }

        function loadPathFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                try {
                    parsePathData(content);
                    document.getElementById('output').textContent = "Path file loaded successfully!";
                } catch (error) {
                    document.getElementById('output').textContent = "Error loading path file: " + error.message;
                }
            };
            reader.readAsText(file);
        }

        function parsePathData(content) {
            points = [];
            segments = [];
            selectedPoint = null;
            
            const arrayMatch = content.match(/double\s+\w*[Pp]ath\w*\s*\[\s*\]\s*\[\s*\]\s*=\s*\{\s*([\s\S]*?)\s*\};/) ||
                              content.match(/\{\s*([\s\S]*?)\s*\}/);
            
            if (!arrayMatch) throw new Error("Invalid path file format. Expected C++ array format.");
            
            const arrayContent = arrayMatch[1];
            const pathPoints = [];
            const pointRegex = /\{\s*(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)\s*\}/g;
            let match;
            
            while ((match = pointRegex.exec(arrayContent)) !== null) {
                pathPoints.push({ x: parseFloat(match[1]), y: parseFloat(match[2]), theta: parseFloat(match[3]), velocity: parseFloat(match[4]) });
            }
            
            if (pathPoints.length === 0) throw new Error("No valid path points found in file.");
            
            const targetPoints = Math.min(15, Math.max(5, Math.floor(pathPoints.length / 20)));
            const sampleRate = Math.max(1, Math.floor(pathPoints.length / targetPoints));
            
            for (let i = 0; i < pathPoints.length; i += sampleRate) {
                const p = pathPoints[i];
                points.push({ x: p.x * PIXEL_TO_INCH + canvas.width / 2, y: canvas.height / 2 - p.y * PIXEL_TO_INCH, heading: p.theta, maxVelocity: Math.abs(p.velocity), manuallySet: true });
            }
            
            const lastFilePoint = pathPoints[pathPoints.length - 1];
            const lastAddedPoint = points[points.length - 1];
            if (Math.hypot(lastFilePoint.x - ((lastAddedPoint.x - canvas.width / 2) / PIXEL_TO_INCH), lastFilePoint.y - ((canvas.height / 2 - lastAddedPoint.y) / PIXEL_TO_INCH)) > 1) {
                points.push({ x: lastFilePoint.x * PIXEL_TO_INCH + canvas.width / 2, y: canvas.height / 2 - lastFilePoint.y * PIXEL_TO_INCH, heading: lastFilePoint.theta, maxVelocity: Math.abs(lastFilePoint.velocity), manuallySet: true });
            }
            
            for (let i = 0; i < points.length - 1; i++) {
                segments.push({ reverse: false });
            }
            
            draw();
            updateControlPanel();
        }

        function clearCanvas() {
            points = [];
            segments = [];
            selectedPoint = null;
            isAnimating = false;
            draw();
            updateControlPanel();
            document.getElementById('output').textContent = '';
        }
        
        function startAnimation() {
            if (points.length < 2) {
                document.getElementById('output').textContent = "Create a path first to simulate.";
                return;
            }
            isAnimating = true;
            animationProgress = 0;
            generateDataForSimulation();
            animateRobot();
        }
        
        function animateRobot() {
            if (!isAnimating || pathPointsData.length === 0) return;
            
            const currentPoint = pathPointsData[Math.floor(animationProgress)];
            
            if (!currentPoint) {
                isAnimating = false;
                draw();
                document.getElementById('output').textContent = "Simulation complete.";
                return;
            }

            const velocity = currentPoint.velocity;
            
            const distancePerFrame = (Math.abs(velocity) / 127) * 2;
            animationProgress += distancePerFrame; 
            
            draw();
            requestAnimationFrame(animateRobot);
        }
        
        function flipHorizontal() {
            points.forEach(p => {
                p.x = canvas.width - p.x;
                p.heading = (360 - p.heading + 180) % 360;
                p.manuallySet = true;
            });
            draw();
            updateControlPanel();
        }
        
        function flipVertical() {
            points.forEach(p => {
                p.y = canvas.height - p.y;
                p.heading = (360 - p.heading) % 360;
                p.manuallySet = true;
            });
            draw();
            updateControlPanel();
        }

        draw();
        updateControlPanel();
    </script>
</body>
